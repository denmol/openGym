name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  #
  # Built from this checkout, always. The image name is deliberately local rather than
  # upstream's ghcr.io/duartesantos8/... : this fork carries the Swedish translation, the AI
  # coach and a food database that upstream's published image does not, so a `docker compose
  # pull` against that name would quietly replace the running app with a different one under
  # an identical tag. A name that nothing can pull cannot be pulled over.
  api:
    image: opengym-api:local
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
    volumes:
      # Users, passkeys, per-user state, the session secret — BACK THIS UP.
      #
      # Defaults to ./data inside the checkout, which is gitignored and so is safe from a
      # `git pull`. It is not safe from a `git clean -xdf`, and a checkout is an odd place
      # to keep the only copy of an account database, so DATA_DIR in .env lets it live
      # somewhere that has nothing to do with git:  DATA_DIR=/var/lib/opengym
      - ${DATA_DIR:-./data}:/data

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: opengym-web:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
